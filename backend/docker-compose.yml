services:
  mysql:
    image: mysql:8.4
    container_name: fridge-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: fridge_db
      MYSQL_USER: fridge_user
      MYSQL_PASSWORD: fridge_pass

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: