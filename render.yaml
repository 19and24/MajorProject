services:
  - type: web
    name: naengbu-api
    runtime: python
    plan: free
    region: singapore
    branch: feature/backend-integration

    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: >-
      python -m alembic upgrade head &&
      python -m uvicorn app.main:app
      --host 0.0.0.0
      --port $PORT

    healthCheckPath: /

    autoDeployTrigger: checksPass

    envVars:
      - key: 
          DATABASE_HOST=gateway01.ap-northeast-1.prod.aws.tidbcloud.com
          DATABASE_PORT=4000
          DATABASE_NAME=fridge_db
          DATABASE_USER=abc123.root
          DATABASE_PASSWORD=실제 비밀번호
          DATABASE_SSL_CA=/etc/ssl/certs/ca-certificates.crt
        sync: false