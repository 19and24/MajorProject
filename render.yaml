services:
  - type: web
    name: naengbu-api
    runtime: python
    plan: free
    region: singapore
    branch: main

    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: >-
      python -m alembic upgrade head &&
      python -m uvicorn app.main:app
      --host 0.0.0.0
      --port $PORT

    healthCheckPath: /

    autoDeployTrigger: checksPass

    envVars:
      - key: DATABASE_URL
        sync: false